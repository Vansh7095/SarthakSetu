# SarthakSetu — Docker Compose Production Stack
# Starts: PostgreSQL + Backend API + Static Frontend + Caddy (HTTPS reverse proxy)
#
# Usage:
#   1. Copy .env.production.example to .env and fill in real values.
#   2. Point your DOMAIN (e.g., sarthaksetu.app) to the server running Docker.
#   3. bash scripts/deploy.sh
#   4. Open https://<DOMAIN>

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sarthaksetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sarthaksetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sarthaksetu}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-sarthaksetu}", "-d", "${POSTGRES_DB:-sarthaksetu}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sarthaksetu-net

  # ---------------------------------------------------------------------------
  # Backend API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: sarthaksetu-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      BASE_PATH: /
      # Set DATABASE_URL directly when using an external database or a password
      # that needs URL encoding. Otherwise Compose builds it from the local DB.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-sarthaksetu}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-sarthaksetu}}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?CLERK_PUBLISHABLE_KEY is required}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sarthaksetu-net

  # ---------------------------------------------------------------------------
  # Static Frontend (nginx)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?CLERK_PUBLISHABLE_KEY is required}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-}
    container_name: sarthaksetu-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sarthaksetu-net

  # ---------------------------------------------------------------------------
  # Caddy Reverse Proxy + HTTPS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: sarthaksetu-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      # :Z is required on Fedora/RHEL systems with SELinux enabled.
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --quiet --tries=1 --spider --header=\"Host: $${DOMAIN}\" https://127.0.0.1/_health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sarthaksetu-net

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  sarthaksetu-net:
    driver: bridge
